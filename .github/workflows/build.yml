name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 (API 37) platform
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/platforms"
          curl -fsSL --retry 3 -o /tmp/platform-37.zip \
            https://dl.google.com/android/repository/platform-37.0_r02.zip
          unzip -q -o /tmp/platform-37.zip -d "$ANDROID_SDK_ROOT/platforms"
          cd "$ANDROID_SDK_ROOT/platforms"
          if [ ! -d android-37 ]; then
            SRC=$(ls -d android-37* 2>/dev/null | head -1)
            [ -n "$SRC" ] && mv "$SRC" android-37
          fi
          cat android-37/source.properties

      - name: Install build-tools 37.0.0
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --install "build-tools;37.0.0" > /dev/null 2>&1 || true
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Read version name
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove existing release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.name }}" --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect release APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/BackTapWallet-v${{ steps.version.outputs.name }}-release.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackTapWallet-v${{ steps.version.outputs.name }}-release
          path: out/BackTapWallet-v${{ steps.version.outputs.name }}-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: BackTap Wallet v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: out/BackTapWallet-v${{ steps.version.outputs.name }}-release.apk
